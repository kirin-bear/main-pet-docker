server {
    listen 301;
    server_name *;
    return 301 https://$host$request_uri;
}

server {

    include mime.types;
    sendfile on;

    listen 443;
    server_name kirin-bear.ru *.kirin-bear.ru;
    client_max_body_size 100m;

    ssl_certificate /etc/nginx/ssl/kirin-bear.ru/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/kirin-bear.ru/kirin-bear.ru.key;

    # необходим резолвер для докер контейнера
    ssl_stapling on;
    resolver 127.0.0.11 ipv6=off valid=300s;
    ssl_stapling_verify on;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $remote_addr;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://kirin-bear-web:8080;
    }

    location /me {
        default_type text/html;
        return 200 "web.kirin-bear.ru";
    }
}
