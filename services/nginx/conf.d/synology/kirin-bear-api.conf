# config для local --------------------------
server {

    include mime.types;
    sendfile on;

    listen 8080;
    server_name *.*;
    client_max_body_size 100m;

    add_header Access-Control-Allow-Origin '*' always; # always позволит прокинуть этот заголовок во все прокси
    add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always; # always позволит прокинуть этот заголовок во все прокси

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $remote_addr;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://kirin-bear-api:8080;
    }

    location /me {
        default_type text/html;
        return 200 "api.kirin-bear.ru";
    }
}
