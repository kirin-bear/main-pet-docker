server {
    listen 80;
    server_name minio.kirin-bear.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name minio.kirin-bear.ru;

    ssl_certificate /etc/nginx/ssl/kirin-bear.ru/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/kirin-bear.ru/kirin-bear.ru.key;

    # необходим резолвер для докер контейнера
    ssl_stapling on;
    resolver 127.0.0.11 ipv6=off valid=300s;
    ssl_stapling_verify on;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        # Default is HTTP/1, keepalive is only enabled in HTTP/1.1
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        proxy_pass http://minio:9000;
    }
}

server {
    listen 80;
    server_name minio-console.kirin-bear.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name minio-console.kirin-bear.ru;

    ssl_certificate /etc/nginx/ssl/kirin-bear.ru/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/kirin-bear.ru/kirin-bear.ru.key;

    # необходим резолвер для докер контейнера
    ssl_stapling on;
    resolver 127.0.0.11 ipv6=off valid=300s;
    ssl_stapling_verify on;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;

        # This is necessary to pass the correct IP to be hashed
        real_ip_header X-Real-IP;

        proxy_connect_timeout 300;

        # To support websockets in MinIO versions released after January 2023
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        chunked_transfer_encoding off;

        proxy_pass http://minio:9001;
    }
}